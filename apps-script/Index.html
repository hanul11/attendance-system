<!doctype html>
<html lang="ko">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="LogiFlow">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <style>
    @import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable-dynamic-subset.css");
    @import url("https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0,0");

    :root {
      --bg: #f7f8fa;
      --surface: #ffffff;
      --soft: #f7f8fa;
      --line: #e7eaf0;
      --text: #171a1f;
      --muted: #667085;
      --faint: #98a2b3;
      --blue: #2563eb;
      --blue-dark: #1d4ed8;
      --blue-soft: #eaf1ff;
      --indigo: #4f46e5;
      --green: #16a34a;
      --teal: #0f9488;
      --amber: #d97706;
      --red: #dc2626;
      --shadow: 0 14px 34px rgba(15, 23, 42, .07);
      --shadow-soft: 0 3px 14px rgba(15, 23, 42, .035);
      --radius: 20px;
      --radius-control: 16px;
      --control-height: 50px;
      --page-padding: 24px;
      --section-gap: 28px;
      --font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-weight: 500;
      letter-spacing: 0;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button, input, select { font: inherit; }
    button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
    button:disabled { cursor: default; opacity: .58; }
    button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid rgba(37, 99, 235, .18); outline-offset: 2px; }
    .hidden { display: none !important; }

    .shell {
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr);
      min-height: 100vh;
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      padding: 22px 16px;
      border-right: 1px solid var(--line);
      background: rgba(255, 255, 255, .84);
      backdrop-filter: blur(18px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 8px 24px;
    }

    .mark {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border-radius: 14px;
      background: var(--blue);
      color: #fff;
      font-weight: 700;
      box-shadow: 0 6px 16px rgba(37, 99, 235, .16);
    }

    .brand h1 { margin: 0; font-size: 16px; font-weight: 700; line-height: 1.1; }
    .brand p { margin: 3px 0 0; color: var(--muted); font-size: 12px; font-weight: 400; }

    .nav button {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      min-height: 48px;
      padding: 10px 12px;
      border: 0;
      border-radius: 14px;
      background: transparent;
      color: var(--muted);
      text-align: left;
      transition: background .18s ease, color .18s ease, transform .18s ease;
    }

    .nav button:hover,
    .nav button.active {
      background: var(--blue-soft);
      color: var(--blue-dark);
    }

    .nav button:active { transform: scale(.99); }

    .side-note {
      margin: 24px 8px 0;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow-soft);
    }

    .side-note strong { display: block; font-size: 13px; }
    .side-note span {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .session-box {
      display: grid;
      gap: 10px;
      margin: 18px 8px 0;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow-soft);
    }

    .session-box strong { display: block; font-size: 13px; }
    .session-box span { color: var(--muted); font-size: 12px; }

    .shell { display: block; min-height: 100vh; }
    .sidebar {
      position: fixed;
      z-index: 10;
      top: auto;
      right: 0;
      bottom: 0;
      left: 0;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(64px, 1fr));
      height: auto;
      padding: 8px max(8px, env(safe-area-inset-left)) calc(8px + env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-right));
      border-top: 1px solid var(--line);
      border-right: 0;
      box-shadow: 0 -6px 22px rgba(15, 23, 42, .055);
    }
    .brand, .side-note, .session-box { display: none; }
    .nav { display: contents; }
    .nav button {
      flex-direction: column;
      justify-content: center;
      gap: 4px;
      min-height: 52px;
      padding: 7px 6px;
      text-align: center;
    }
    .nav span { display: block; font-size: 11px; }

    main { min-width: 0; padding: max(22px, env(safe-area-inset-top)) var(--page-padding) calc(96px + env(safe-area-inset-bottom)); }
    body.login-screen .shell { display: block; min-height: 100vh; }
    body.login-screen .sidebar { display: none; }
    body.login-screen main {
      display: grid;
      min-height: 100vh;
      min-height: 100dvh;
      align-items: start;
      justify-items: center;
      padding: max(clamp(24px, 5vh, 46px), env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(22px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    }
    body.login-screen #login { width: min(440px, 100%); }
    body.login-screen .login-wrap { width: 100%; min-height: auto; }
    body.login-screen .login-wrap.compact { grid-template-columns: minmax(0, 1fr); }
    .view { display: none; }
    .view.active { display: block; animation: rise .22s ease both; }

    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 20px;
    }

    .title {
      margin: 0;
      font-size: clamp(25px, 3vw, 34px);
      font-weight: 700;
      line-height: 1.12;
    }

    .subtitle {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
      font-weight: 500;
      line-height: 1.45;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 10px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 34px;
      padding: 0 11px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, .82);
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .chip.good {
      border-color: rgba(22, 163, 74, .22);
      background: rgba(22, 163, 74, .08);
      color: #087136;
    }

    .chip.warn {
      border-color: rgba(217, 119, 6, .24);
      background: rgba(217, 119, 6, .08);
      color: #98550d;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 0 4px rgba(22, 163, 74, .12);
    }

    .chip.warn .dot { box-shadow: 0 0 0 4px rgba(217, 119, 6, .12); }

    .grid { display: grid; gap: 16px; }
    .cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }

    .card, .panel {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow-soft);
    }

    .card {
      min-height: 96px;
      padding: 20px;
      transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
    }

    .card:hover {
      transform: translateY(-1px);
      border-color: rgba(37, 99, 235, .22);
      box-shadow: 0 8px 22px rgba(15, 23, 42, .055);
    }

    .label { color: var(--muted); font-size: 13px; font-weight: 600; }

    .icon {
      display: grid;
      place-items: center;
      width: 32px;
      height: 32px;
      border-radius: 12px;
      background: var(--blue-soft);
      color: var(--blue);
      font-size: 12px;
      font-weight: 600;
    }

    .icon svg { width: 17px; height: 17px; }
    .icon .material-symbols-rounded { font-size: 18px; }

    .icon.green, .icon.teal, .icon.amber { background: var(--blue-soft); color: var(--blue); }

    .value {
      display: flex;
      align-items: baseline;
      gap: 7px;
      min-height: 28px;
      font-size: 24px;
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      line-height: 1;
    }

    .value small { color: var(--muted); font-size: 13px; font-weight: 500; }
    .content {
      display: grid;
      grid-template-columns: minmax(0, 1.3fr) minmax(330px, .85fr);
      gap: 20px;
      margin-top: 24px;
    }

    .panel { padding: 22px; }
    .panel-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .panel h2 { margin: 0; font-size: 17px; font-weight: 600; }
    .panel p { margin: 5px 0 0; color: var(--muted); font-size: 13px; font-weight: 500; line-height: 1.45; }

    .time {
      display: grid;
      place-items: center;
      border-radius: var(--radius);
      background: #fff;
      box-shadow: var(--shadow-soft);
    }

    .pill, .tag {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      white-space: nowrap;
      font-weight: 600;
    }

    .pill {
      min-height: 28px;
      padding: 0 10px;
      background: #fff;
      color: var(--green);
      font-size: 12px;
    }

    .pill.warn { color: #98550d; }

    .tag {
      min-height: 24px;
      padding: 0 8px;
      background: var(--blue-soft);
      color: var(--blue-dark);
      font-size: 12px;
    }

    .tag.green { background: rgba(22, 163, 74, .10); color: #087136; }
    .tag.amber { background: rgba(217, 119, 6, .10); color: #98550d; }
    .tag.gray { background: #eef2f7; color: #58677d; }

    #employee {
      width: 100%;
      max-width: 880px;
      margin: 0 auto;
    }

    .material-symbols-rounded {
      font-size: 22px;
      font-variation-settings: "FILL" 0, "wght" 500, "GRAD" 0, "opsz" 24;
      line-height: 1;
    }

    .home-topbar,
    .home-brand,
    .home-status-row,
    .home-section-head,
    .home-recent-main,
    .home-recent-times {
      display: flex;
      align-items: center;
    }

    .home-topbar,
    .home-section-head { justify-content: space-between; }
    .home-topbar { gap: 16px; }
    .home-brand { min-width: 0; gap: 10px; }

    .home-logo-shell {
      position: relative;
      flex: 0 0 38px;
      width: 38px !important;
      height: 38px !important;
      overflow: hidden !important;
      line-height: 0;
    }

    .home-logo {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }

    .home-logo-view {
      width: 38px !important;
      height: 38px !important;
      background-color: transparent !important;
      background-position: left center;
      background-repeat: no-repeat;
      background-size: auto 38px;
    }

    .home-brand strong {
      display: block;
      color: var(--text);
      font-size: 15px;
      font-weight: 700;
      line-height: 1.1;
    }

    .home-brand span {
      display: block;
      margin-top: 3px;
      color: var(--faint);
      font-size: 10px;
      font-weight: 500;
    }

    .live-clock {
      color: var(--muted);
      text-align: right;
    }

    .live-clock strong {
      color: var(--text);
      font-size: 22px;
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      line-height: 1;
    }

    .home-hero {
      display: grid;
      gap: 20px;
      padding: 2px 0 4px;
    }

    .home-greeting { padding-top: 10px; }
    .home-kicker {
      margin: 0 0 6px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 500;
    }

    .home-greeting h1 {
      margin: 0;
      font-size: clamp(27px, 5vw, 36px);
      font-weight: 700;
      line-height: 1.16;
    }

    .home-date-copy {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .home-date-copy strong { color: var(--text); font-weight: 600; }
    .home-status-row { flex-wrap: wrap; gap: 8px; margin-top: 14px; }

    .home-work-status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 34px;
      padding: 0 12px;
      border-radius: 999px;
      background: #fff7e8;
      color: #a35b05;
      font-size: 13px;
      font-weight: 700;
    }

    .home-work-status::before {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #f59e0b;
      content: "";
    }

    .home-work-status.work { background: #eaf8f0; color: #087443; }
    .home-work-status.work::before { background: #16a34a; }
    .home-work-status.done { background: #edf3ff; color: #2455bd; }
    .home-work-status.done::before { background: #3b82f6; }
    .home-status-copy { margin: 10px 0 0; color: var(--muted); font-size: 12px; }

    .home-status-row .chip {
      min-height: 34px;
      padding: 0 11px;
      border: 0;
      background: #eef2f7;
      font-size: 12px;
    }

    .clock-actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .clock {
      display: grid;
      min-height: 92px;
      grid-template-columns: 34px auto;
      grid-template-rows: auto auto;
      align-content: center;
      align-items: center;
      justify-content: center;
      column-gap: 8px;
      border: 0;
      border-radius: var(--radius-control);
      color: #fff;
      font-size: 17px;
      font-weight: 700;
      transition: transform .16s ease, filter .16s ease, box-shadow .16s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .clock .material-symbols-rounded { grid-row: 1 / 3; font-size: 28px; }
    .clock:active:not(:disabled) { transform: scale(.975); }
    .clock:hover:not(:disabled) { filter: brightness(1.03); }
    .clock:disabled { opacity: .48; box-shadow: none; }
    .clock.in { background: var(--blue); box-shadow: 0 10px 24px rgba(37, 99, 235, .18); }
    .clock.out { background: #e44c55; box-shadow: 0 10px 24px rgba(228, 76, 85, .16); }
    .clock.done { background: #e7ebf1; color: #657287; box-shadow: none; }
    .clock.done:disabled { opacity: 1; }
    .clock.loading { opacity: .88; filter: saturate(.82); }
